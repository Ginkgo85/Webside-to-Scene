name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  codeql:
    uses: ./.github/workflows/codeql-analysis.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  release:
    needs: codeql
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Release kann nur auf main gestartet werden."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test and validate source
        run: npm test
      - name: Install pinned browser test dependency
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Install Chromium and Firefox
        run: npx --no-install playwright install --with-deps chromium firefox
      - name: Test interactive scene in Chromium
        run: npm run test:browser
      - name: Test interactive scene in Firefox
        run: npm run test:browser
        env:
          TEST_BROWSER: firefox
      - name: Build release
        run: npm run build:release
      - name: Verify release artifacts
        run: npm run test:release
      - name: Create new tag and release
        run: node tools/release.mjs --publish
        env:
          GH_TOKEN: ${{ github.token }}
